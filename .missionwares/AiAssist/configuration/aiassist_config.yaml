# ===============================================================
# @title mAi - AI Assist Configuration
# @file aiassist_config.yaml
# @filepath .missionwares/AiAssist/configuration/aiassist_config.yaml
# @project Project-OpenCertification
# @version 4.4.0
# @updated 2026-10-29 06:18:40 PM CDT
#
# @description
# Configuration for the MissionWares AI Assist application.
# Generated by Configuration Wizard.
#
# @layout
# COMMON blocks are identical in every mAi project: copy them whole
# from one project to the next. PROJECT blocks belong to this project
# only: never copy them. Every rule the Methodology defines is in the
# COMMON blocks, even where this project does not use it yet, so every
# project can create and update those files.
#
# @sections (in the order they appear; * = has a PROJECT block)
# - common_output_directory   - Where every generator writes
# - common_ignore_patterns  * - Single source of truth for all generators
# - common_exceptions       * - Files kept even when an ignore pattern matches
# - ai_directive              - The Methodology and Mission sources and output filenames
# - dashboard_engine          - Living Dashboard engine source of truth (Core_16)
# - wire                    * - THE COURIER: the file lane and the run lane
# - documentation             - Project documentation management
# - generate_tree             - Project tree visualization
# - generate_paths            - File path listing
# - generate_todos            - Todo, doing and done listing
# - generate_context          - Context file generation
# - generate_consolidated     - Consolidated file assembly
# - generate_code_zip         - Project code zip for chat sessions
# ===============================================================

common_output_directory: ".missionwares/AiAssist/generated"
auto_clear_output_on_capture: true

# ---------------------------------------------------------------
# COMMON IGNORE PATTERNS
# Single source of truth for all generators — tree, paths, and zip.
# ---------------------------------------------------------------
common_ignore_patterns:
  # ===== COMMON: identical in every mAi project =====
  # tools, version control and editors
  - ".missionwares"
  - ".ai_assist"
  - ".git"
  - "*.gitignore"
  - ".vscode"
  - ".DS_Store"
  - ".sftpignore"
  - ".private"
  # build and test output
  - "build"
  - "DerivedData"
  - "target"
  - ".pio"
  - "node_modules"
  - "extensions"
  - "generated"
  - "output"
  - ".allure"
  - "allure-report"
  - "allure-results"
  - "*-build.log"
  # Methodology folders that do not go to the chat
  - "_archive"
  - "_handoff"
  - "_marketing"
  - "_reference"
  - "_ai_directive_mission"
  - "_workorder"
  # media, design, data and platform files
  - "*.gif"
  - "*.jpg"
  - "*.jpeg"
  - "*.png"
  - "*.svg"
  - "*.afdesign"
  - "*.ttf"
  - "*.wav"
  - "Assets.xcassets"
  - "*.entitlements"
  - "SampleData"
  - "*.mmdb"
  # ===== PROJECT: only =====
  # (none)


# ---------------------------------------------------------------
# Common Exceptions — override ignore patterns for specific files
# Add filenames or globs here to include them even if they match
# an ignore pattern above. Example: "CHANGELOG.md", "*.config"
# ---------------------------------------------------------------
common_exceptions:
  # ===== COMMON: identical in every mAi project =====
  # (none)
  # ===== PROJECT: only =====
  # (none)

# ---------------------------------------------------------------
# AI Directives — portable "secret sauce" documents
# Two directives are generated and placed in Claude Project Files:
#   methodology  — HOW we work (universal, points to shared location)
#   mission      — WHAT we build and WHY (per-project, lives in _docs)
# ---------------------------------------------------------------
ai_directive:

  methodology:
    directory: /Users/gregpaskal/GoogleDrive/Documents/Development/Methodology/Project-mAi-Methodology/ai_directive_methodology/
    output_filename: AI_Directive_Methodology.md

  mission:
    directory: _docs/_ai_directive_mission/
    output_filename: AI_Directive_Mission.md
    optional: true

# ---------------------------------------------------------------
# Dashboard Engine — Living Dashboard framework (Core_16)
# Source of truth for the engine files. AiAssist stamps copies into
# _docs/_dashboard/_framework/ at Launch and re-stamps whenever the
# framework fingerprint differs from the source. Engine changes happen
# at the source only — never in a consumer's copy.
# ---------------------------------------------------------------
dashboard_engine:
  directory: /Users/gregpaskal/GoogleDrive/Documents/Development/Methodology/Project-mAi-Methodology/dashboard_engine/
  templates:
    index: index.html
  framework:
    - _framework/dashboard.js
    - _framework/styles.css

# ---------------------------------------------------------------
# Wire — THE COURIER fleet listener channel.
# Routing needs no config: every Navigation Bay project is
# deliverable. Spec: WireConfig in ProjectConfig.swift.
# ---------------------------------------------------------------
wire:
  topic: "greg-mai-wire-k4m9"
  ping_topic: "greg-pingme-x7k2-mw"
  # file_lane: which project files the wire may touch.
  file_lane:
    rules:
    # ===== COMMON: identical in every mAi project =====
    # the project's tools: its automated tests and their catalog, the run lane scripts (Core_06, Core_13)
    - match: tree
      path: _tools
      allow:
      - read
      - add
      - update
      types:
      - js
      - java
      - sh
      - json
      - md
      - html
    # the mission files (Core_09)
    - match: tree
      path: _docs/_ai_directive_mission
      allow:
      - read
      - add
      - update
      - rename
      - delete
    # what the project can do, where each capability came from, and its test procedures (Core_06)
    - match: tree
      path: _docs/_capabilities
      allow:
      - read
      - add
      - update
      - rename
      types:
      - md
    # work orders this project receives (Core_03)
    - match: tree
      path: _docs/_workorder
      allow:
      - read
      - add
      - update
      - rename
      types:
      - md
    # what test executions produced: test logs, results, measurements; never edited after the test (Core_06, Core_13)
    - match: tree
      path: _docs/_test_results
      allow:
      - read
      - add
      - update
      - rename
      types:
      - md
      - csv
      - json
      - txt
    # investigations: risks, causes and conclusions, each citing the test results it rests on (Core_06)
    - match: tree
      path: _docs/_findings
      allow:
      - read
      - add
      - update
      - rename
      types:
      - md
      - csv
      - json
      - txt
    # design decisions and direction: how a part of the product is meant to look, sound and behave, and why (Core_06)
    - match: tree
      path: _docs/_design
      allow:
      - read
      - add
      - update
      - rename
      types:
      - md
    # ===== PROJECT: only =====
    # the game itself: everything Claude builds and fixes in the browser game
    - match: tree
      path: Resources/game
      allow:
      - read
      - add
      - update
      - rename
      - delete
      types:
      - html
      - js
      - json
      - css
  # run_lane: which scripts the wire may run.
  run_lane:
    rules:
    # ===== COMMON: identical in every mAi project =====
    # scripts in _tools/run, such as the endurance test (Core_13 Section 9); 3 hours, unattended
    - match: tree
      path: _tools/run
      timeout: 10800
      approve: never
    # ===== PROJECT: only =====
    # (none)

# ---------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------
documentation:
  base_directory: "_docs"
  auto_generate_missing: true
  required_files:
    - "README.md"
    - "REQUIREMENTS.md"
    - "ARCHITECTURE.md"
    - "FEATURES.md"
    - "ISSUES.md"
    - "CHANGELOG.md"
    - "API.md"
    - "SETUP.md"
  assets_directory: "assets"
  versioning:
    enabled: true
    track_changes: true
    backup_on_major_updates: false

generate_tree:
  output_file: "tree.md"
  output_locations:
    - path: "${common_output_directory}/support/tree"
      save_timestamped_version: false

generate_paths:
  output_file: "paths.md"
  exclude_directories: true
  output_locations:
    - path: "${common_output_directory}/support/paths"
      save_timestamped_version: false

generate_todos:
  output_file: "Todo_Doing_Done.md"
  output_locations:
    - path: "${common_output_directory}/support/todo"
      save_timestamped_version: false

generate_context:
  output_file: "context.txt"
  maximum_line_length: 25000
  output_locations:
    - path: "${common_output_directory}/support/context"
      save_timestamped_version: false

generate_consolidated:
  output_locations:
    - path: "${common_output_directory}/support/consolidated"
      save_timestamped_version: false

generate_code_zip:
  zip_prefix: "project_code"
  output_locations:
    - path: "${common_output_directory}/ai_deliverable"
      save_timestamped_version: false
