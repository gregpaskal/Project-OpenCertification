@description: The Journal page type's starting page, founded as journal.html at a project's dashboard root (tokens
  swapped, founding refused if any token survives). A FOUNDED file: it belongs to the project from birth and is never
  overwritten; it carries only identity (the DASH_* variables and the mai-* meta tags) and the Journal's frame. Entries
  are one Markdown file each in journal/, built with the project's technical docs into journal/journal-data.js and
  journal/docs-data.js by the type's journal-export.js; _framework/_templates/journal/journal.js draws them by date, by
  tag and by glossary term, and journal-search.js finds terms, entries and doc sections from one box.
  Previewed at the engine home, the unswapped tokens rendering as literal text are the tell that this is the template.
@tags: template, page-type, journal, search, thin-shell, living-dashboard
@changeLog:
Date        Author         Version        Description
----------  -------------  -------------  --------------------------
2026-11-13  Greg & Claude  1.0.0          The Journal page type's starting page, harvested from Project-AI-Local journal.html 1.0.0: its styles moved to journal.css, its scripts to the stamped type, Lab Search named Search, no glossary file loaded, page-type identity meta tags
=============================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mai-project" content="{{PROJECT_KEY}}">
<meta name="mai-founded" content="{{FOUNDED_AT}}">
<meta name="mai-page-type" content="journal">
<meta name="mai-page-template-version" content="1.0.0">
<title>Journal</title>
<link rel="stylesheet" href="_framework/styles.css">
<link rel="stylesheet" href="_framework/_templates/journal/journal.css">
</head>
<body>

<script>
  /* Identity: the only configuration a page carries. */
  window.DASH_PROJECT = '{{PROJECT_KEY}}';
  window.DASH_NAME    = '{{PROJECT_NAME}}';
  window.DASH_PAGE    = 'JOURNAL';
  window.DASH_HOME    = 'index.html';
  window.DASH_FOUNDED = '{{FOUNDED_AT}}';
</script>

<div id="authored">

<section id="search">
  <h2>SEARCH <span class="tag" id="jn-q-count">loading</span></h2>
  <input id="jn-q-input" class="jn-q-input" type="search" placeholder="search the glossary, the journal and the docs" autocomplete="off" aria-label="Search the glossary, the journal and the docs">
  <div id="jn-q-results" class="jn-q-results" hidden></div>
</section>

<section id="journal">
  <h2>JOURNAL <span class="tag" id="jn-count">loading</span></h2>
  <div class="jn-tabs">
    <button type="button" class="jn-tab" data-view="date">BY DATE</button>
    <button type="button" class="jn-tab" data-view="tag">BY TAG</button>
    <button type="button" class="jn-tab" data-view="term">BY TERM</button>
  </div>
  <div id="jn-list" class="jn-list"></div>
</section>

<section id="reader">
  <h2>READER</h2>
  <div id="jn-reader" class="jn-reader" hidden></div>
</section>

</div>

<script src="journal/journal-data.js"></script>
<script src="journal/docs-data.js"></script>
<script src="_framework/dashboard.js"></script>
<script src="_framework/_templates/journal/journal-search.js"></script>
<script src="_framework/_templates/journal/journal.js"></script>
</body>
</html>
