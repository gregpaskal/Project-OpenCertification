@description: The Diagrams page type's example diagram: how a diagram reaches the page (SVG file, data entry, card,
full-window viewer). A FOUNDED file, copied once and replaced by the project's first real diagram. The changelog
ruler uses underscores because an XML comment cannot contain two hyphens in a row and a browser refuses the image.
@tags: diagram, example, template
@changeLog:
Date        Author         Version        Description
__________  _____________  _____________  __________________________
2026-11-12  Greg & Claude  1.0.0          Example diagram for the Diagrams page type
2026-11-12  Greg & Claude  1.0.1          Moved with the engine: the page types now live in dashboard_engine/_framework/_templates/, so AiAssist copies them with the engine (framework entry "- _framework/"); @filepath follows, template 1.0.1
=============================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="1200" height="600" fill="#0B0E14"/>
  <text x="60" y="70" font-size="22" letter-spacing="4" fill="#ffa657">HOW A DIAGRAM REACHES THIS PAGE</text>
  <text x="60" y="100" font-size="14" fill="#7A859E">four steps, left to right; replace this file with the project's first real diagram</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/>
    </marker>
  </defs>
  <g id="step-svg">
    <rect x="60" y="200" width="220" height="140" rx="12" fill="#111622" stroke="#79c0ff" stroke-width="2"/>
    <text x="170" y="250" font-size="16" fill="#3FD8E8" text-anchor="middle">1  THE SVG</text>
    <text x="170" y="285" font-size="13" fill="#D7DEEA" text-anchor="middle">filed in</text>
    <text x="170" y="308" font-size="13" fill="#D7DEEA" text-anchor="middle">diagrams/svg/</text>
  </g>
  <g id="step-entry">
    <rect x="340" y="200" width="220" height="140" rx="12" fill="#111622" stroke="#79c0ff" stroke-width="2"/>
    <text x="450" y="250" font-size="16" fill="#3FD8E8" text-anchor="middle">2  THE ENTRY</text>
    <text x="450" y="285" font-size="13" fill="#D7DEEA" text-anchor="middle">one object in</text>
    <text x="450" y="308" font-size="13" fill="#D7DEEA" text-anchor="middle">diagrams-data.js</text>
  </g>
  <g id="step-card">
    <rect x="620" y="200" width="220" height="140" rx="12" fill="#111622" stroke="#79c0ff" stroke-width="2"/>
    <text x="730" y="250" font-size="16" fill="#3FD8E8" text-anchor="middle">3  THE CARD</text>
    <text x="730" y="285" font-size="13" fill="#D7DEEA" text-anchor="middle">drawn by</text>
    <text x="730" y="308" font-size="13" fill="#D7DEEA" text-anchor="middle">diagrams.js</text>
  </g>
  <g id="step-viewer">
    <rect x="900" y="200" width="240" height="140" rx="12" fill="#111622" stroke="#7ee787" stroke-width="2"/>
    <text x="1020" y="250" font-size="16" fill="#7ee787" text-anchor="middle">4  THE VIEWER</text>
    <text x="1020" y="285" font-size="13" fill="#D7DEEA" text-anchor="middle">full window,</text>
    <text x="1020" y="308" font-size="13" fill="#D7DEEA" text-anchor="middle">pan and zoom</text>
  </g>
  <line x1="282" y1="270" x2="336" y2="270" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562" y1="270" x2="616" y2="270" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="842" y1="270" x2="896" y2="270" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="440" font-size="13" fill="#ffd966">The project owns steps 1 and 2. Steps 3 and 4 are the page type, stamped by AiAssist from the engine home.</text>
  <text x="60" y="470" font-size="13" fill="#7A859E">Click a card to open it; drag to pan; pinch or Cmd + scroll to zoom; 0 fits; Esc closes.</text>
</svg>