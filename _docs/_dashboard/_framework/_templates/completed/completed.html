@description: The Completed page type's starting page, founded as completed.html at a project's dashboard root (tokens
  swapped, founding refused if any token survives). A FOUNDED file: it belongs to the project from birth and is never
  overwritten; it carries only identity (the DASH_* variables and the mai-* meta tags) and the page's frame. The
  entries live in completed/completed-data.js; _framework/_templates/completed/completed.js draws them, newest first.
  Previewed at the engine home, the unswapped tokens rendering as literal text are the tell that this is the template.
@tags: template, page-type, completed, trophy-room, thin-shell, living-dashboard
@changeLog:
Date        Author         Version        Description
----------  -------------  -------------  --------------------------
2026-11-17  Greg & Claude  1.0.0          The Completed page type's starting page, harvested from Automation-JAV-AIModels completed.html 1.1.0 and this project's 1.2.0: one section, cards drawn from the data file, never written by hand
=============================================================== -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mai-project" content="{{PROJECT_KEY}}">
<meta name="mai-founded" content="{{FOUNDED_AT}}">
<meta name="mai-page-type" content="completed">
<meta name="mai-page-template-version" content="1.0.0">
<title>Completed</title>
<link rel="stylesheet" href="_framework/styles.css">
<link rel="stylesheet" href="_framework/_templates/completed/completed.css">
</head>
<body>

<script>
  /* Identity: the only configuration a page carries. */
  window.DASH_PROJECT = '{{PROJECT_KEY}}';
  window.DASH_NAME    = '{{PROJECT_NAME}}';
  window.DASH_PAGE    = 'COMPLETED';
  window.DASH_HOME    = 'index.html';
  window.DASH_LEDGER  = 'backlog.html';
  window.DASH_FOUNDED = '{{FOUNDED_AT}}';
</script>

<div id="authored">

<section id="completed">
  <h2>COMPLETED <span class="tag" id="cp-count">loading</span></h2>
  <p class="cp-intro">Finished work, whole and dated, newest first. Each card keeps its board id or BL- number.</p>
  <div class="boards" id="cp-cards"><span class="cp-empty">Nothing finished yet.</span></div>
</section>

</div>

<script src="_framework/dashboard.js"></script>
<script src="completed/completed-data.js"></script>
<script src="_framework/_templates/completed/completed.js"></script>
</body>
</html>
